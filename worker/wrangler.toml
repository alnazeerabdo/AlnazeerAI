# ============================================================
# مساعد النذير — Cloudflare Worker config
# ------------------------------------------------------------
# Deploy:
#   cd worker
#   npx wrangler login
#   npx wrangler secret put GROQ_KEY      # your Groq API key
#   npx wrangler deploy
#
# Worker name must stay "alnazeerai" to keep the current URL:
#   https://alnazeerai.alnzyrbdalmnm90.workers.dev/
# (that URL is hardcoded in script.js -> AI_WORKER_URL)
#
# After deploying, test with:
#   curl -X POST https://alnazeerai.alnzyrbdalmnm90.workers.dev/ \
#        -H "Content-Type: application/json" \
#        -d '{"messages":[{"role":"user","content":"ما خدماتك؟"}]}'
# ============================================================

name = "alnazeerai"
main = "worker.js"
compatibility_date = "2025-01-01"

# --- استيراد النص الأمامي من ملف نصي قابل للتحرير ---
# بعد تعديل worker/system.txt نفّذ: npx wrangler deploy
rules = [
  { type = "Text", globs = ["**/*.txt"], fallthrough = true }
]

# --- Vars ---
# احظر أي موقع آخر من استخدام المساعد عبر المتصفح (لا يوقف curl، لكنه يوقف صفحات الأخطار).
# إذا انتقلت إلى نطاق مخصص أضفه هنا بفواصل، وإلا يتوقف المساعد عن الرد.
[vars]
ALLOWED_ORIGINS = "https://alnazeerabdo.github.io"

# --- الحماية ---
# 1) حدود KV: 30 طلب/دقيقة/IP + 150 طلب/يوم/IP + 50 رسالة/يوم/جلسة
# 2) فلتر حقن التعليمات + سقف حجم الطلب
# 3) قفل النطاق (ALLOWED_ORIGINS أعلاه)
# الكابتشا (Turnstile) مُعطّلة: حُذف TURNSTILE_SECRET ولم يعد العميل يرسل رمزاً.
# لإعادة التفعيل لاحقاً: npx wrangler secret put TURNSTILE_SECRET
# + أعد إضافة TURNSTILE_SITEKEY هنا وكود المصادقة في العميل.

# --- Rate limiting عبر KV (فعّال منذ إنشاء الـ namespace) ---
# يقيّد: 30 طلب/دقيقة/IP + 150 طلب/يوم/IP + 50 رسالة/يوم/جلسة
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "f12908835a134d30bef317f8d3e5c0d3"
